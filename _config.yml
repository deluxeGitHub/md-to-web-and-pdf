title: "MD to PDF and Web"
description: "Convert Markdown to web and PDF with ease"
plugins:
  - jekyll-toc
  - jekyll-relative-links

defaults:
  - scope:
      path: ""
    values:
      layout: default
      template: base
      lang: de

relative_links:
  enabled: true

# ACHTUNG: test/_config.test.yml spiegelt diese Liste ohne test/, damit die
# Testdokumente für den Fixture-Vergleich gebaut werden. Änderungen hier dort
# nachziehen.
exclude:
  - harness/
  - wordpress/
  - scripts/
  - temp/
  - test/
  - example/
  - build.sh
  - generate_pdf_local.sh
  - README.md
  - CLAUDE.md
  - LICENSE
